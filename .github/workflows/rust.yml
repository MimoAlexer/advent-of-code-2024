name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - run: rustup component add rustfmt
      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo build --release --locked
